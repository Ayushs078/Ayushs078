<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="6" viewBox="0 0 1200 6" role="img" aria-label="divider">
<defs>
<linearGradient id="g" x1="-1" y1="0" x2="0" y2="0">
<stop offset="0" stop-color="#1E2A3A"/>
<stop offset="0.4" stop-color="#FF9F1C"/>
<stop offset="0.6" stop-color="#22D3EE"/>
<stop offset="1" stop-color="#1E2A3A"/>
<animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/>
<animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/>
</linearGradient>
</defs>
<rect width="1200" height="6" rx="3" fill="#1E2A3A" opacity="0.5"/>
